name: 🐳 Build and Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  license:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Intentionally minimal: nothing to scan (repo + submodule templates are Apache-2.0); just assert LICENSE exists.
      - name: Verify LICENSE present
        run: |
          test -f LICENSE
          echo "LICENSE present — repo Apache-2.0; templates via vLLM submodule (Apache-2.0)."

  build:
    name: Build and Push
    runs-on: ubuntu-latest
    # PR #54566 changes a compiled CUDA operator; rebuilding that extension can
    # exceed short organization defaults even though the normal cached build is fast.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile               # production image (no suffix)
            flavor: ""
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      # Skip a matrix leg whose Dockerfile is absent on this branch (guards future per-branch variants).
      - name: Check Dockerfile exists
        id: dockerfile
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.dockerfile }} absent — skipping this variant"
          fi

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.dockerfile.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=${{ matrix.flavor }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Expose Actions cache runtime
        if: steps.dockerfile.outputs.exists == 'true'
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build and push
        if: steps.dockerfile.outputs.exists == 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Validate on PR; push only on branch/tag/dispatch.
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # vLLM's CUDA extension exceeds this repository's runner lifetime on a
          # cold build. sccache writes each completed object to Actions cache,
          # so interrupted/retried jobs resume instead of recompiling it.
          secret-envs: |
            gha-cache-url=ACTIONS_CACHE_URL
            gha-runtime-token=ACTIONS_RUNTIME_TOKEN
          secrets: |
            github-token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache${{ matrix.flavor }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache${{ matrix.flavor }},mode=max

      - name: Image digest
        if: steps.dockerfile.outputs.exists == 'true'
        run: echo "${{ steps.build.outputs.digest }}"
